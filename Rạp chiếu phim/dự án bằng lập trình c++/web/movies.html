<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Danh Sách Phim – CineMax</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .movies-page{padding:120px 24px 80px;max-width:1280px;margin:0 auto}
    .filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:40px;padding:20px 24px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg)}
    .filter-bar label{font-size:.8rem;font-weight:600;color:var(--text-400);margin-bottom:4px;display:block}
    .filter-select{background:var(--bg-700);border:1.5px solid var(--glass-border);color:var(--text-200);padding:8px 14px;border-radius:var(--radius-md);font-size:.88rem;font-family:inherit;cursor:pointer}
    .filter-select:focus{outline:none;border-color:var(--primary)}
    .search-input{background:var(--bg-700);border:1.5px solid var(--glass-border);color:var(--text-200);padding:8px 14px;border-radius:var(--radius-md);font-size:.88rem;font-family:inherit;width:220px}
    .search-input:focus{outline:none;border-color:var(--primary)}
    .movie-detail-card{display:flex;gap:24px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;cursor:pointer;transition:var(--ease-med)}
    .movie-detail-card:hover{border-color:rgba(229,9,20,.3);transform:translateX(4px)}
    .detail-poster{width:100px;height:150px;border-radius:var(--radius-md);background:var(--bg-600);display:flex;align-items:center;justify-content:center;font-size:3.5rem;flex-shrink:0}
    .detail-info{flex:1}
    .detail-title{font-size:1.15rem;font-weight:800;color:var(--text-100);margin-bottom:6px}
    .detail-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:.82rem;color:var(--text-400)}
    .detail-desc{font-size:.875rem;color:var(--text-300);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .detail-actions{display:flex;gap:10px;align-items:center}
    .rating-stars{color:var(--gold);font-size:.9rem;font-weight:700}
    .results-count{font-size:.85rem;color:var(--text-400);margin-bottom:16px}
    .no-results{text-align:center;padding:80px 20px;color:var(--text-400)}
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar scrolled" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo"><span class="logo-icon">🎬</span><span class="logo-text">CineMax</span></a>
    <div class="nav-links" id="navLinks">
      <a href="index.html"      class="nav-link">Trang chủ</a>
      <a href="movies.html"     class="nav-link active">Phim</a>
      <a href="my-tickets.html" class="nav-link" id="myTicketsLink" style="display:none">Vé của tôi</a>
    </div>
    <div class="nav-actions">
      <a href="my-tickets.html" class="btn-outline" id="myTicketsBtn" style="display:none">🎟️ Vé của tôi</a>
      <a href="admin/dashboard.html" class="btn-outline" id="adminBtn" style="display:none">🛠️ Admin</a>
      <span class="user-info" id="userInfo" style="display:none"></span>
      <button class="btn-primary" id="loginBtn"  onclick="openLoginModal()">Đăng nhập</button>
      <button class="btn-danger"  id="logoutBtn" style="display:none" onclick="logout()">Đăng xuất</button>
    </div>
    <button class="hamburger" id="hamburger">☰</button>
  </div>
</nav>

<div class="movies-page">
  <h1 style="font-size:2rem;font-weight:800;color:var(--text-100);margin-bottom:8px">🎬 Phim Đang Chiếu</h1>
  <p style="color:var(--text-400);margin-bottom:28px">Khám phá tất cả bộ phim đang và sắp chiếu tại CineMax</p>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div>
      <label>🔍 Tìm kiếm</label>
      <input type="text" class="search-input" id="searchInput" placeholder="Tên phim, diễn viên..." oninput="applyFilters()"/>
    </div>
    <div>
      <label>🎭 Thể loại</label>
      <select class="filter-select" id="genreFilter" onchange="applyFilters()">
        <option value="">Tất cả</option>
        <option>Hành động</option>
        <option>Tình cảm</option>
        <option>Kinh dị</option>
        <option>Hoạt hình</option>
        <option>Hài hước</option>
      </select>
    </div>
    <div>
      <label>🔞 Độ tuổi</label>
      <select class="filter-select" id="ageFilter" onchange="applyFilters()">
        <option value="">Tất cả</option>
        <option value="0">Mọi lứa tuổi (P)</option>
        <option value="13">T13+</option>
        <option value="16">T16+</option>
        <option value="18">T18+</option>
      </select>
    </div>
    <div>
      <label>📊 Sắp xếp</label>
      <select class="filter-select" id="sortFilter" onchange="applyFilters()">
        <option value="rating">Đánh giá cao nhất</option>
        <option value="votes">Nhiều lượt xem nhất</option>
        <option value="title">Tên A–Z</option>
        <option value="duration">Ngắn nhất</option>
      </select>
    </div>
    <div style="margin-left:auto">
      <label>&nbsp;</label>
      <button class="btn-outline" onclick="clearFilters()" style="display:block">✕ Xoá bộ lọc</button>
    </div>
  </div>

  <p class="results-count" id="resultsCount"></p>
  <div id="moviesList"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-bottom"><p>© 2024 CineMax.</p></div>
  </div>
</footer>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeLoginModal()">✕</button>
    <div class="modal-tabs">
      <button class="tab-btn active" id="loginTab"    onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab-btn"        id="registerTab" onclick="switchTab('register')">Đăng ký</button>
    </div>
    <div id="loginForm">
      <h2 class="modal-title">Chào mừng trở lại! 👋</h2>
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com" class="form-input"/></div>
      <div class="form-group"><label>Mật khẩu</label>
        <div class="input-wrapper"><input type="password" id="loginPassword" placeholder="••••••••" class="form-input"/><button class="toggle-pw" onclick="togglePassword('loginPassword')">👁</button></div>
      </div>
      <div id="loginError" class="error-msg"></div>
      <button class="btn-submit" onclick="handleLogin()">Đăng nhập</button>
      <div class="divider"><span>demo</span></div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="demo-btn" onclick="fillDemo('an.tran@gmail.com','123456')">👤 Khách</button>
        <button class="demo-btn" onclick="fillDemo('admin@cinema.vn','admin123')">🛠️ Admin</button>
      </div>
    </div>
    <div id="registerForm" style="display:none">
      <h2 class="modal-title">Tạo tài khoản ✨</h2>
      <div class="form-group"><label>Họ tên</label><input type="text" id="regName" placeholder="Nguyễn Văn A" class="form-input"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@gmail.com" class="form-input"/></div>
      <div class="form-group"><label>SĐT</label><input type="tel" id="regPhone" placeholder="0912345678" class="form-input"/></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPassword" placeholder="≥ 6 ký tự" class="form-input"/></div>
      <div id="regError" class="error-msg"></div>
      <button class="btn-submit" onclick="handleRegister()">Đăng ký ngay</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const genre  = document.getElementById('genreFilter').value;
  const age    = document.getElementById('ageFilter').value;
  const sort   = document.getElementById('sortFilter').value;

  let movies = MovieService.getAll();

  if (search) movies = movies.filter(m =>
    m.title.toLowerCase().includes(search) ||
    m.cast.toLowerCase().includes(search) ||
    m.director.toLowerCase().includes(search));

  if (genre) movies = movies.filter(m => m.genre.includes(genre));
  if (age !== '') movies = movies.filter(m => m.ageLimit === +age);

  movies.sort((a, b) => {
    if (sort === 'rating')   return b.rating - a.rating;
    if (sort === 'votes')    return b.votes - a.votes;
    if (sort === 'title')    return a.title.localeCompare(b.title, 'vi');
    if (sort === 'duration') return a.duration - b.duration;
    return 0;
  });

  document.getElementById('resultsCount').textContent = `Tìm thấy ${movies.length} phim`;
  renderList(movies);
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('genreFilter').value = '';
  document.getElementById('ageFilter').value   = '';
  document.getElementById('sortFilter').value  = 'rating';
  applyFilters();
}

function renderList(movies) {
  const el = document.getElementById('moviesList');
  if (!movies.length) {
    el.innerHTML = '<div class="no-results"><div style="font-size:3rem">🎭</div><p>Không tìm thấy phim nào phù hợp.</p></div>';
    return;
  }
  el.innerHTML = movies.map(m => {
    const suats = ShowtimeService.getByMovie(m.id);
    const starsCount = Math.round(m.rating / 2);
    const stars = '⭐'.repeat(starsCount) + '☆'.repeat(5 - starsCount);
    return `
    <div class="movie-detail-card" onclick="window.location.href='booking.html?movie=${m.id}'">
      <div class="detail-poster">${getPosterHTML(m.poster)}</div>
      <div class="detail-info">
        <div class="detail-title">
          ${m.title}
          ${m.status==='hot'?'<span class="movie-badge hot" style="position:static;display:inline-block;margin-left:8px">🔥 HOT</span>':''}
          ${m.status==='new'?'<span class="movie-badge new" style="position:static;display:inline-block;margin-left:8px">✨ MỚI</span>':''}
        </div>
        <div class="detail-meta">
          <span>🎭 ${m.genre}</span>
          <span>⏱ ${fmtDuration(m.duration)}</span>
          <span>🎬 ${m.director}</span>
          <span style="color:${m.ageLimit===0?'#1db954':'#e50914'};font-weight:700">${m.ageLimit===0?'P':'T'+m.ageLimit}</span>
          <span>📅 ${suats.length} suất chiếu hôm nay</span>
        </div>
        <p class="detail-desc">${m.desc}</p>
        <div class="detail-actions">
          <span class="rating-stars">${stars}</span>
          <span style="font-weight:700;color:var(--text-100)">${m.rating}/10</span>
          <span style="color:var(--text-400);font-size:.8rem">(${m.votes.toLocaleString('vi-VN')} đánh giá)</span>
          <button class="btn-primary" style="margin-left:auto;font-size:.85rem;padding:10px 20px"
            onclick="event.stopPropagation();window.location.href='booking.html?movie=${m.id}'">
            🎟️ Đặt vé
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  await window.dbInitialized;
  applyFilters();
});
</script>
</body>
</html>
